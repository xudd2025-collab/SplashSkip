<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>开屏助手 · 电脑控件检查器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#1d2940;font:14px system-ui,"Microsoft YaHei",sans-serif}header{background:white;padding:18px 25px;border-bottom:1px solid #d9e0ed;display:flex;gap:20px;align-items:center}h1{font-size:19px;margin:0}button,select,input{font:inherit;border:1px solid #cad4e7;border-radius:8px;padding:7px;background:white;color:inherit}button{cursor:pointer}main{display:grid;grid-template-columns:minmax(300px,40vw) 1fr;gap:18px;padding:18px;height:calc(100vh - 90px)}section{background:white;border-radius:12px;padding:16px;min-height:0;overflow:auto}.canvas{position:relative;margin:auto;max-width:100%;height:calc(100% - 55px);text-align:center}.canvas img{max-width:100%;max-height:100%;object-fit:contain}.canvas svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#tree{display:flex;flex-direction:column;gap:3px;max-height:42vh;overflow:auto;margin:12px 0}#tree button{text-align:left;font:12px ui-monospace,monospace;border:none;white-space:nowrap}#tree button.active{background:#e4edff;color:#104eb3}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8fc;padding:12px;border-radius:9px}small{color:#6a7590}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#note{padding:8px 0;color:#56637f}.pill{background:#edf3ff;border-radius:12px;padding:4px 8px}
.canvas img{width:100%;height:100%;object-position:center top}
</style>
<header><h1>电脑控件检查器</h1><span class="pill">父子层级 + 当前截图</span><small>本地离线 · 查看与标注不会点击手机</small></header>
<main><section><div class="toolbar"><button id="prev">上一帧</button><select id="frames"></select><button id="next">下一帧</button><label><input type="checkbox" id="boxes" checked>控件框</label></div><div id="note"></div><div class="canvas" id="canvas"><img id="screen"><svg id="overlay"></svg></div></section>
<section><div class="toolbar"><input id="filter" placeholder="筛选文字、ID、类名"><select id="source"><option value="all">原生＋视觉</option><option value="native">只看原生</option><option value="vision">只看视觉补充</option></select><button id="parent">查看父控件</button><button id="positive">标为关闭目标</button><button id="negative">标为非目标</button><button id="export">导出标注</button></div><div id="tree"></div><h3>当前控件与父子关系</h3><pre id="details">点击控件树或截图选中控件</pre><small>紫色为视觉补充，没有原生点击接口；几何包含关系不代表真实父子关系。标注表示这一帧的控件身份，不表示点击成功。</small></section></main>
<script>
const frames=/*CAPTURE_DATA*/[];let frameIndex=0,selected=-1;const labels=new Map();
const $=id=>document.getElementById(id);function current(){return frames[frameIndex]}
function nodes(f){return [...f.tree_nodes.map(n=>({...n,source:n.source||'native'})),...(f.visual_nodes||[]).map((n,i)=>({...n,index:f.tree_nodes.length+i,parent:-1,visual_id:i}))]}
function shown(n){return $('source').value==='all'||$('source').value===n.source}
frames.forEach((f,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`第 ${i+1} 帧 · ${f.tree_nodes.length} 个控件`; $('frames').append(o)});
function escText(n){return n.text||n.description||n.id||n.class.split('.').pop()}
function draw(){const f=current();if(!f)return;$('frames').value=frameIndex;$('screen').src=f.image;$('overlay').setAttribute('viewBox',`0 0 ${f.width} ${f.height}`);$('overlay').setAttribute('preserveAspectRatio','xMidYMin meet');$('screen').style.verticalAlign='top';
const why={time_budget:'采集超时',node_limit:'节点数量上限',depth_limit:'层级深度上限',unavailable_children:'系统未返回部分子节点',provider_error:'节点提供方错误',payload_limit:'数据容量上限'};
$('note').textContent=`${f.package} · 原生 ${f.tree_nodes.length} / 视觉补充 ${(f.visual_nodes||[]).length} · ${f.tree_complete?'原生遍历完成（不代表自绘内容都有节点）':'原生遍历未完成'} · ${(f.truncation_reasons||[]).map(x=>why[x]||x).join('、')} · 截图与控件需人工核对`;
const q=$('filter').value.toLowerCase(),all=nodes(f);$('tree').replaceChildren();all.forEach(n=>{if(!shown(n)||q&&!JSON.stringify(n).toLowerCase().includes(q))return;let depth=0,p=n.parent;while(p>=0&&depth<48){depth++;p=f.tree_nodes[p]?.parent??-1}const b=document.createElement('button');b.textContent=`${'  '.repeat(depth)}#${n.index} ${n.source==='vision'?'[视觉] ':''}${escText(n)} ${n.clickable?'[原生可点击]':''}`;b.className=n.index===selected?'active':'';if(n.source==='vision')b.style.color='#7c3bb5';b.onclick=()=>{selected=n.index;draw()};$('tree').append(b)});
$('overlay').replaceChildren();if($('boxes').checked)all.forEach(n=>{if(!shown(n)||!n.visible&&n.index!==selected)return;const [l,t,r,b]=n.bounds;if(r<=l||b<=t)return;const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');for(const [k,v] of Object.entries({x:l,y:t,width:r-l,height:b-t,fill:n.index===selected?'#4b7fff30':'none',stroke:n.index===selected?'#ff355b':n.source==='vision'?'#9b41d9':'#3277ed66','stroke-dasharray':n.source==='vision'?'8 4':'none','stroke-width':n.index===selected?5:2}))rect.setAttribute(k,v);$('overlay').append(rect)});
if(selected>=0){const n=all[selected],chain=[];if(n.source==='vision'){$('parent').textContent='查看所在容器';$('details').textContent=JSON.stringify({视觉节点:n,几何所在容器:f.tree_nodes[n.anchor_native_index]||null,说明:'只有图像位置包含关系，没有取得原生父子关系；不可直接执行原生控件点击。'},null,2)}else{let at=n;while(at&&chain.length<49){chain.push({index:at.index,text:at.text,id:at.id,clickable:at.clickable,bounds:at.bounds});at=f.tree_nodes[at.parent]}$('parent').textContent='查看父控件';$('details').textContent=JSON.stringify({原生控件:n,原生父控件链:chain,原生子控件:f.tree_nodes.filter(v=>v.parent===selected).map(v=>v.index)},null,2)}}else $('details').textContent='点击控件树或截图选中控件';}
$('frames').onchange=()=>{frameIndex=+$('frames').value;selected=-1;draw()};$('prev').onclick=()=>{frameIndex=Math.max(0,frameIndex-1);selected=-1;draw()};$('next').onclick=()=>{frameIndex=Math.min(frames.length-1,frameIndex+1);selected=-1;draw()};$('filter').oninput=draw;$('boxes').onchange=draw;$('source').onchange=draw;$('parent').onclick=()=>{if(selected>=0){const n=nodes(current())[selected];selected=n.source==='vision'?n.anchor_native_index:n.parent;draw()}};
$('screen').onclick=e=>{const f=current(),r=e.target.getBoundingClientRect();const scale=Math.min(r.width/f.width,r.height/f.height),x=(e.clientX-r.left-(r.width-f.width*scale)/2)/scale,y=(e.clientY-r.top)/scale;const ns=nodes(f).filter(n=>shown(n)&&n.visible&&x>=n.bounds[0]&&x<=n.bounds[2]&&y>=n.bounds[1]&&y<=n.bounds[3]).sort((a,b)=>(a.bounds[2]-a.bounds[0])*(a.bounds[3]-a.bounds[1])-(b.bounds[2]-b.bounds[0])*(b.bounds[3]-b.bounds[1]));if(ns.length){selected=ns[0].index;draw()}};
function label(v){if(selected<0)return;const n=nodes(current())[selected],key=frameIndex+':'+selected;labels.set(key,{frame:current().file,node:n.source==='vision'?'visual:'+n.visual_id:selected,node_source:n.source,label:v,objective:'control_candidate',source:'human_review'});$('details').textContent+='\n已标注：'+(v?'关闭目标':'非目标')}
$('positive').onclick=()=>label(1);$('negative').onclick=()=>label(0);$('export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({schema:1,records:[...labels.values()]},null,2)],{type:'application/json'}));a.href=url;a.download='control-annotations.json';a.click();URL.revokeObjectURL(url)};draw();
</script></html>
